name: Build Mod with DEX

on: [push, pull_request]

jobs:
  buildJarWithDex:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Build Desktop JAR
      run: |
        chmod +x ./gradlew
        ./gradlew clean jar
    
    - name: Convert to DEX
      run: |
        d8 --output dex-classes.jar build/libs/singularity-reactors-modDesktop.jar
        mkdir -p final-jar
        unzip -q dex-classes.jar -d final-jar
        unzip -q singularity-reactors-mod.jar -d final-jar
        cd final-jar
        zip -qr ../singularity-reactors-mod.jar *
        cd ..
        ls -lh singularity-reactors-mod.jar
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: singularity-reactors-mod
        path: singularity-reactors-mod.jar
