name: Build Mod with DEX

on: [push, pull_request]

jobs:
  buildJarWithDex:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Android build-tools in PATH
      run: |
        D8_DIR=$(dirname $(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n 1))
        echo "Found d8 in: $D8_DIR"
        echo "$D8_DIR" >> $GITHUB_PATH
    
    - name: Build Desktop JAR
      run: |
        chmod +x ./gradlew
        ./gradlew clean jar
    
    - name: Convert to DEX and package universal JAR
      run: |
        d8 --output dex-classes.jar build/libs/singularity-reactors-modDesktop.jar
        mkdir -p final-jar
        unzip -q build/libs/singularity-reactors-modDesktop.jar -d final-jar
        unzip -q -o dex-classes.jar -d final-jar
        cd final-jar
        zip -qr ../singularity-reactors-mod.jar *
        cd ..
        ls -lh singularity-reactors-mod.jar
        unzip -l singularity-reactors-mod.jar | grep -E "(classes\.dex|mod\.)"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: singularity-reactors-mod
        path: singularity-reactors-mod.jar
