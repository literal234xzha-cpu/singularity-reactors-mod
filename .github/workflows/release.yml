name: Release Mod with DEX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.4)'
        required: true
        default: 'v2.2.4'

permissions:
  contents: write

jobs:
  buildAndRelease:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Build Desktop JAR
      run: |
        chmod +x ./gradlew
        ./gradlew clean jar
    
    - name: Convert to DEX and package universal JAR
      run: |
        d8 --output dex-classes.jar build/libs/singularity-reactors-modDesktop.jar
        mkdir -p final-jar
        unzip -q build/libs/singularity-reactors-modDesktop.jar -d final-jar
        unzip -q -o dex-classes.jar -d final-jar
        cd final-jar
        zip -qr ../singularity-reactors-mod.jar *
        cd ..
        ls -lh singularity-reactors-mod.jar
        unzip -l singularity-reactors-mod.jar | grep -E "(classes\.dex|mod\.)"
    
    - name: Upload to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
        gh release upload "$TAG" singularity-reactors-mod.jar --clobber
