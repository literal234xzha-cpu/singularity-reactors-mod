# Reactores
block.singularity-reactors-singularity-reactor-hyper.name = Reactor Alpha
block.singularity-reactors-singularity-reactor-hyper.description = Reactor de singularidad basico. 50k energia/s. Consume Plastanium, Thorium, Agua y Criofluido.

block.singularity-reactors-singularity-reactor-impact.name = Reactor Beta
block.singularity-reactors-singularity-reactor-impact.description = Reactor mejorado. 80k energia/s. Consumo moderado de recursos.

block.singularity-reactors-singularity-reactor-neodymium.name = Reactor Gamma
block.singularity-reactors-singularity-reactor-neodymium.description = Reactor avanzado. 150k energia/s. Requiere Slag adicional.

block.singularity-reactors-singularity-reactor-impactor.name = Reactor Omega
block.singularity-reactors-singularity-reactor-impactor.description = Reactor definitivo. 250k energia/s. Consumo BRUTAL de recursos. Requiere 4 liquidos.

# Nodos
block.singularity-reactors-resistive-power-node.name = Nodo-R
block.singularity-reactors-resistive-power-node.description = Nodo resistivo basico. Rango 8 tiles, 6 conexiones.

block.singularity-reactors-heavy-power-node.name = Nodo-P
block.singularity-reactors-heavy-power-node.description = Nodo pesado. Rango 20 tiles, 15 conexiones.

block.singularity-reactors-superconductor-node.name = Nodo-SC
block.singularity-reactors-superconductor-node.description = Nodo superconductor. Rango 40 tiles, 25 conexiones. Requiere energia.

# Sistema de Gestion
block.singularity-reactors-power-monitor.name = Monitor de Energia
block.singularity-reactors-power-monitor.description = Monitorea la red electrica. Produccion, consumo, balance y satisfaccion en tiempo real.

block.singularity-reactors-power-controller-root.name = Controlador Root
block.singularity-reactors-power-controller-root.description = Control directo de generadores en rango. Toggle ON/OFF y cap de produccion por generador.

block.singularity-reactors-power-controller-net.name = Controlador Net
block.singularity-reactors-power-controller-net.description = Gestor de red electrica completa. Cap global, modo emergencia y control por categorias.

block.singularity-reactors-universal-block-manager.name = Gestor Universal
block.singularity-reactors-universal-block-manager.description = Controla cualquier bloque en rango. Toggle ON/OFF, cambiar item/liquido configurado.

block.singularity-reactors-liquid-controller.name = Controlador de Liquidos
block.singularity-reactors-liquid-controller.description = Monitorea tuberias y bloques con liquidos. Nivel, alertas y toggle por bloque.

# Nuevos Monitores y Controladores
block.singularity-reactors-power-monitor-local.name = Monitor Local
block.singularity-reactors-power-monitor-local.description = Monitorea solo la red a la que esta conectado. Produccion, consumo, balance y satisfaccion en tiempo real.

block.singularity-reactors-power-monitor-global.name = Monitor Global
block.singularity-reactors-power-monitor-global.description = Escanea todas las redes en rango de 40 tiles. Muestra produccion, consumo y balance total de todas las redes detectadas.

block.singularity-reactors-battery-monitor.name = Monitor de Baterias
block.singularity-reactors-battery-monitor.description = Monitorea baterias en rango. Muestra nivel de carga, alertas de bateria baja y toggle ON/OFF por bateria.

block.singularity-reactors-item-controller.name = Controlador de Items
block.singularity-reactors-item-controller.description = Controla cintas, sorters y routers en rango. Toggle ON/OFF y cambio de item configurado por bloque.
