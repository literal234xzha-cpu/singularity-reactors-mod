name: Build Mod

on: [push, pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindustry-singularity-mod

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build mod jar (Desktop only)
      run: |
        chmod +x ./gradlew
        ./gradlew jar
    - name: Upload built jar file
      uses: actions/upload-artifact@v4
      with:
        name: singularity-reactors-modDesktop
        path: mindustry-singularity-mod/build/libs/singularity-reactors-modDesktop.jar
