# Reactores
block.singularity-reactor-hyper.name = Reactor Alpha
block.singularity-reactor-hyper.description = Reactor de singularidad básico. 50k energía/s. Consume Plastanium, Thorium, Agua y Criofluido.

block.singularity-reactor-impact.name = Reactor Beta
block.singularity-reactor-impact.description = Reactor mejorado. 80k energía/s. Consumo moderado de recursos.

block.singularity-reactor-neodymium.name = Reactor Gamma
block.singularity-reactor-neodymium.description = Reactor avanzado. 150k energía/s. MUY comilón - requiere Slag adicional.

block.singularity-reactor-impactor.name = Reactor Omega
block.singularity-reactor-impactor.description = Reactor definitivo. 250k energía/s. Consumo BRUTAL de recursos. Requiere 4 líquidos.

# Nodos
block.resistive-power-node.name = Nodo-R
block.resistive-power-node.description = Nodo resistivo básico. Pérdida moderada por distancia.

block.heavy-power-node.name = Nodo-P
block.heavy-power-node.description = Nodo pesado. Menos pérdidas, mayor rango.

block.superconductor-node.name = Nodo-SC
block.superconductor-node.description = Nodo superconductor. Casi sin pérdidas. Requiere energía para funcionar.

# Sistema de Gestión
block.power-monitor.name = Monitor de Energía
block.power-monitor.description = Monitorea la red eléctrica en tiempo real. Muestra producción, consumo, balance y satisfacción de la red. Incluye historial gráfico y alertas de déficit.

block.power-controller-root.name = Controlador Root
block.power-controller-root.description = Acceso directo a generadores en rango. Permite encender/apagar individualmente cada generador y limitar su producción con un cap de 0-100%. Rango: 8 tiles.

block.power-controller-net.name = Controlador Net
block.power-controller-net.description = Gestor de red eléctrica completa. Controla productores, consumidores y baterías vía PowerGraph. Cap global de producción, modo emergencia y pestañas por categoría.

block.universal-block-manager.name = Gestor Universal
block.universal-block-manager.description = Controla cualquier bloque configurable en rango. Toggle ON/OFF para cintas, generadores y fabricantes. Cambia el item o líquido configurado en sorters, unloaders, clasificadores y más. Rango: 15 tiles.

block.liquid-controller.name = Controlador de Líquidos
block.liquid-controller.description = Monitorea y controla tuberías y bloques con líquidos en rango. Muestra nivel actual de cada bloque, alertas de nivel bajo configurables, filtro por tipo de líquido y toggle ON/OFF individual. Rango: 12 tiles.

